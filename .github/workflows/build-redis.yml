name: Repackage phpredis (add compression support)

# ==========================================================================
# Repackages php8.6-redis EXACTLY like build-php.yml does (same source:
# phpredis default branch, same version detection from package.xml,
# same checkinstall packaging) — the ONLY difference is that compression
# support is enabled at configure time:
#
#   Compression:  lzf, zstd, lz4
#
# Everything else is untouched: serializers stay php/json, session+json
# enabled by default, same version 6.3.0RC1, same package layout.
#
# Pipeline (fast, ~4 min, does NOT rebuild PHP from source):
#   1. Downloads existing .deb packages from a GitHub Release
#   2. Installs PHP 8.6 (cli/dev/common) from those .debs
#   3. Clones phpredis (default branch, same as build-php.yml)
#   4. Configures with compression flags, builds, packages via checkinstall
#   5. Verifies compiled-in compression (phpinfo + constants, hard gate)
#   6. Functional round-trip test against a local redis-server (hard gate)
#   7. Publishes: replaces php8.6-redis_*.deb on the release
# ==========================================================================

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to download PHP debs from and publish to (empty = latest release)'
        type: string
        default: ''
      target_series:
        description: 'PHP series (must match the release debs)'
        type: string
        default: '8.6'
      pkg_revision:
        description: 'Debian package revision (-N suffix)'
        type: string
        default: '1'
      publish:
        description: 'Replace php8.6-redis_*.deb on the release when build + tests pass'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-redis:
    name: Repackage phpredis with compression
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7

      # ----------------------------------------------------------------
      # Resolve target release (explicit input, or latest)
      # ----------------------------------------------------------------
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            # NOTE: gh release view (latest) ignores prereleases — every release
            # in this repo is a prerelease, so resolve via the releases list API.
            # REST API field is tag_name (tagName only exists in gh's --json format)
            TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve the latest release tag"
            exit 1
          fi
          echo "Target release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # Download pre-built PHP .deb files from the release
      # ----------------------------------------------------------------
      - name: Download PHP .deb files from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p php-debs
          gh release download '${{ steps.tag.outputs.tag }}' \
            --repo '${{ github.repository }}' \
            --pattern '*.deb' \
            --dir php-debs/
          echo "Downloaded $(ls php-debs/*.deb | wc -l) .deb files"

      # ----------------------------------------------------------------
      # Install system build deps + our PHP 8.6
      # ----------------------------------------------------------------
      - name: Install PHP and build dependencies
        run: |
          set -eo pipefail

          sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          APT::Get::Assume-Yes "true";
          EOF
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/azure-cli.list
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get update; then break; fi
            [ "$attempt" -eq 3 ] && { echo "::error::apt-get update failed"; exit 1; }
            sleep 5
          done

          # Add packages.sury.org/php (runtime dependency: php-common).
          # Our php8.6-* packages require php-common (>= 2:95~) which stock
          # jammy does not provide -- same setup as build-php.yml/e2e jobs.
          curl -fsSL https://packages.sury.org/php/apt.gpg | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/sury-php.gpg
          echo "deb https://packages.sury.org/php/ jammy main" | sudo tee /etc/apt/sources.list.d/sury-php.list > /dev/null
          for attempt in 1 2 3; do
            if sudo timeout 60 apt-get update; then break; fi
            [ "$attempt" -eq 3 ] && { echo "::error::sury apt-get update failed"; exit 1; }
            sleep 5
          done

          # libzstd-dev / liblz4-dev: zstd + lz4 compression support
          # redis-server: local instance for the functional round-trip test
          sudo apt-get install -y --no-install-recommends \
            build-essential checkinstall pkg-config git \
            libzstd-dev liblz4-dev \
            redis-server redis-tools

          # Install our PHP 8.6 debs (provides php, phpize8.6, php-config8.6)
          sudo dpkg -i php-debs/*.deb || sudo apt-get -f install -y
          php${{ inputs.target_series }} -v

      # ----------------------------------------------------------------
      # Build phpredis (same as build-php.yml) + compression flags,
      # package via checkinstall, verify, test
      # ----------------------------------------------------------------
      - name: Build and package phpredis with compression
        id: build
        run: |
          set -euo pipefail

          SERIES="${{ inputs.target_series }}"
          PHP_BIN="php${SERIES}"
          PHPIZE="phpize${SERIES}"
          PCONF="/usr/bin/php-config${SERIES}"
          [ ! -x "$PCONF" ] && PCONF="$(command -v php-config)"
          WORK="$PWD/redis-work"
          mkdir -p "$WORK"

          echo "php-config: $PCONF"

          # ------------------------------------------------------------
          # 1. phpredis from default branch (same source as build-php.yml;
          #    the 6.3.0RC1 release tag does NOT compile against PHP 8.6 —
          #    develop tip does, and package.xml still reports 6.3.0RC1)
          # ------------------------------------------------------------
          echo "::group::phpredis clone + phpize"
          git clone --depth 1 https://github.com/phpredis/phpredis.git "$WORK/redis"
          cd "$WORK/redis"
          "$PHPIZE"
          echo "::endgroup::"

          # ------------------------------------------------------------
          # 2. configure — defaults identical to build-php.yml, ONLY
          #    compression flags added on top
          # ------------------------------------------------------------
          echo "::group::configure (compression enabled)"
          ./configure \
            --with-php-config="$PCONF" \
            --enable-redis-lzf \
            --enable-redis-zstd \
            --with-libzstd \
            --enable-redis-lz4 \
            --with-liblz4 2>&1 | tee configure.log

          # Hard gate: configure must have resolved every compression dep
          for feat in liblzf libzstd liblz4; do
            if grep -qiE "(Cannot find|not found|Please reinstall).*$feat|only system $feat is supported" configure.log; then
              echo "::error::phpredis configure could not resolve '$feat' support"
              exit 1
            fi
          done
          echo "::endgroup::"

          # ------------------------------------------------------------
          # 3. make
          # ------------------------------------------------------------
          echo "::group::make"
          make -j"$(nproc)"
          echo "::endgroup::"

          # ------------------------------------------------------------
          # 4. Package as .deb via checkinstall — same convention as
          #    build-php.yml (pkgname php8.6-redis, version from package.xml)
          # ------------------------------------------------------------
          echo "::group::checkinstall packaging"
          EXT_VER=$(grep -oP '<release>\K[^<]+' package.xml | head -1) || true
          if [ -z "$EXT_VER" ]; then
            EXT_VER=$(git describe --tags 2>/dev/null | sed 's/^v//') || true
          fi
          [ -z "$EXT_VER" ] && EXT_VER="0.0.0~$(git rev-parse --short HEAD)"
          [[ ! "$EXT_VER" =~ ^[0-9] ]] && EXT_VER="0.0.0~${EXT_VER}"
          echo "phpredis version: $EXT_VER (revision ${{ inputs.pkg_revision }})"

          sudo checkinstall -D \
            --pkgname="php${SERIES}-redis" \
            --pkgversion="$EXT_VER" \
            --pkgrelease="${{ inputs.pkg_revision }}" \
            --maintainer="markusfoo" \
            --pkgsource="PECL" \
            --pkggroup="php" \
            --nodoc \
            --fstrans=no \
            --backup=no \
            --install=no \
            -y make install 2>&1 | tee checkinstall.log

          DEB=$(ls -t *.deb 2>/dev/null | head -1 || true)
          if [ -z "$DEB" ]; then
            echo "::error::checkinstall produced no .deb file"
            exit 1
          fi
          mv "$DEB" "$GITHUB_WORKSPACE/"
          echo "Built: $DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "deb_version=$EXT_VER" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          # ------------------------------------------------------------
          # 5. VERIFY compiled-in compression (hard gate before publish)
          # ------------------------------------------------------------
          echo "::group::verify compiled-in compression"
          REDIS_SO="$WORK/redis/modules/redis.so"
          INFO=$("$PHP_BIN" -d extension="$REDIS_SO" -i)
          echo "$INFO" | grep -A8 "^redis$" || true
          SER_LINE=$(echo "$INFO" | grep -i "serializer" | head -1 || true)
          COM_LINE=$(echo "$INFO" | grep -i "compression" | head -1 || true)
          echo "Serializers line : $SER_LINE"
          echo "Compression line : $COM_LINE"

          VERIFY_FAIL=0
          # serializers must stay default (php/json) — nothing added, nothing removed
          for tok in php json; do
            if ! echo "$SER_LINE" | grep -qi "$tok"; then
              echo "::error::Serializer '$tok' missing (unexpected default change)"
              VERIFY_FAIL=1
            fi
          done
          # compression must now include lzf, zstd, lz4
          for tok in lzf zstd lz4; do
            if ! echo "$COM_LINE" | grep -qi "$tok"; then
              echo "::error::Compression '$tok' is NOT compiled in (missing from: $COM_LINE)"
              VERIFY_FAIL=1
            fi
          done
          [ "$VERIFY_FAIL" -eq 0 ] || exit 1

          "$PHP_BIN" -d extension="$REDIS_SO" -r '
            $need = [
              "Redis::COMPRESSION_LZF"  => Redis::COMPRESSION_LZF,
              "Redis::COMPRESSION_ZSTD" => Redis::COMPRESSION_ZSTD,
              "Redis::COMPRESSION_LZ4"  => Redis::COMPRESSION_LZ4,
            ];
            foreach ($need as $name => $val) {
              printf("%-26s = %d OK\n", $name, $val);
            }
          ' || { echo "::error::constant verification failed"; exit 1; }
          echo "Compression support VERIFIED"
          echo "::endgroup::"

          # ------------------------------------------------------------
          # 6. Functional round-trip test against local redis-server
          # ------------------------------------------------------------
          echo "::group::functional round-trip test"
          sudo systemctl start redis-server 2>/dev/null || sudo redis-server --daemonize yes --save '' --appendonly no
          for i in $(seq 1 10); do
            redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          redis-cli ping || { echo "::error::redis-server did not start"; exit 1; }

          cat > "$WORK/test_redis.php" <<'PHP'
          <?php
          $redis = new Redis();
          $redis->connect('127.0.0.1', 6379);
          $data = [
            'name'    => 'php-apt-builder',
            'numbers' => range(1, 500),
            'blob'    => str_repeat('x', 2048),
          ];
          $tests = [
            [Redis::SERIALIZER_PHP,  Redis::COMPRESSION_LZF,  'php  + lzf '],
            [Redis::SERIALIZER_PHP,  Redis::COMPRESSION_ZSTD, 'php  + zstd'],
            [Redis::SERIALIZER_PHP,  Redis::COMPRESSION_LZ4,  'php  + lz4 '],
            [Redis::SERIALIZER_JSON, Redis::COMPRESSION_ZSTD, 'json + zstd'],
          ];
          $failed = 0;
          foreach ($tests as [$ser, $comp, $label]) {
            $redis->setOption(Redis::OPT_SERIALIZER, $ser);
            $redis->setOption(Redis::OPT_COMPRESSION, $comp);
            $redis->del('testkey');
            $redis->set('testkey', $data);
            $back = $redis->get('testkey');
            $ok = ($back === $data);
            printf("  %-12s round-trip: %s\n", $label, $ok ? 'OK' : 'FAIL');
            if (!$ok) { $failed++; }
          }
          exit($failed ? 1 : 0);
          PHP

          "$PHP_BIN" -d extension="$REDIS_SO" "$WORK/test_redis.php" || {
            echo "::error::functional round-trip test FAILED"
            exit 1
          }
          echo "Functional round-trip test PASSED"
          echo "::endgroup::"

      # ----------------------------------------------------------------
      # Publish: replace php8.6-redis_*.deb on the release
      # ----------------------------------------------------------------
      - name: Publish to release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          REPO='${{ github.repository }}'
          SERIES='${{ inputs.target_series }}'
          DEB='${{ steps.build.outputs.deb }}'

          # Delete previous redis .deb assets, upload the new one
          PREFIX="php${SERIES}-redis_"
          OLD_IDS=$(gh api "repos/$REPO/releases/tags/$TAG" | jq -r --arg p "$PREFIX" '.assets[] | select(.name | startswith($p)) | .id')
          for ID in $OLD_IDS; do
            OLD_NAME=$(gh api "repos/$REPO/releases/assets/$ID" --jq .name)
            echo "Deleting old asset: $OLD_NAME (id=$ID)"
            gh api -X DELETE "repos/$REPO/releases/assets/$ID"
          done

          echo "Uploading $DEB to release $TAG"
          gh release upload "$TAG" "$DEB" --repo "$REPO" --clobber

          # Prepend a note to the release body (keep original notes)
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > /tmp/old_body.md || echo "" > /tmp/old_body.md
          {
            echo "### $(date -u +%Y-%m-%d) — php${SERIES}-redis repackaged with compression support (lzf + zstd + lz4)"
            echo
            echo "- Same phpredis version, compression now enabled at compile time"
            echo "- New asset: \`${DEB}\` (replaces previous php${SERIES}-redis_*.deb)"
            echo
            echo "<details><summary>Original release notes</summary>"
            echo
            cat /tmp/old_body.md
            echo
            echo "</details>"
          } > /tmp/new_body.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/new_body.md \
            || echo "::warning::release body update failed (asset already uploaded)"

      # ----------------------------------------------------------------
      # Job summary
      # ----------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "## phpredis repackage summary"
            echo
            if [ '${{ job.status }}' = 'success' ]; then
              echo "| Item | Value |"
              echo "|---|---|"
              echo "| Release | \`${{ steps.tag.outputs.tag }}\` |"
              echo "| Package | \`${{ steps.build.outputs.deb }}\` |"
              echo "| Compression | **lzf**, **zstd**, **lz4** (new) |"
              echo "| Serializers | php, json (unchanged, as before) |"
              echo "| Gates passed | configure flags, phpinfo, constants, functional round-trip |"
            else
              echo "Build FAILED — see the failed step logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
